question:
  title: De waterkringloop
  description: Beschrijf in een paar zinnen de belangrijkste fasen van de
    waterkringloop.
answer:
  value: Water verdampt uit oceanen en meren, condenseert tot wolken en valt als
    neerslag terug naar het aardoppervlak. Via rivieren en grondwater stroomt het
    daarna terug naar zee, en de kringloop is rond.
