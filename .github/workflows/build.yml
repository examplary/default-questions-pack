name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Test
        run: |
          # Install dependencies
          yarn

          # Run unit tests
          yarn test

      - name: Release
        env:
          EXAMPLARY_API_KEY: ${{ secrets.EXAMPLARY_API_KEY }}
        run: |
          # Bundle and upload the app and its question types to Examplary staging
          npx @examplary/cli@latest app upload --host https://api-staging.examplary.ai

          # Bundle and upload the app and its question types to Examplary production
          npx @examplary/cli@latest app upload
