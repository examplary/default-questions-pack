name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Test
        run: |
          # Install dependencies
          yarn

          # Run unit tests
          yarn test

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Validate
        run: |
          # Install dependencies
          yarn

          # Validate the app and every question type it bundles
          npx @examplary/cli@latest app validate

