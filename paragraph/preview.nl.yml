question:
  title: "Achtergrond: de waterkringloop"
  description: De waterkringloop beschrijft hoe water zich verplaatst tussen de
    oceanen, de atmosfeer en het land. Energie van de zon zorgt voor verdamping
    uit open water, terwijl planten waterdamp afgeven via transpiratie. De vragen
    in dit onderdeel bouwen voort op deze achtergrond, dus lees de tekst goed
    voordat je verdergaat.
