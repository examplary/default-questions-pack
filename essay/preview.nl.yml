question:
  title: De Industriële Revolutie
  description: Schrijf een essay over de sociale gevolgen van de Industriële
    Revolutie voor arbeidersgezinnen in Europa. Gebruik kopjes om je antwoord te
    structureren.
answer:
  value: <h2>Een veranderende samenleving</h2><p>De Industriële Revolutie
    veranderde de Europese samenleving ingrijpend. Gezinnen die al generaties
    lang het land bewerkten, trokken naar snelgroeiende steden, waar fabriekswerk
    de plaats innam van werk op het land.</p><p>De arbeidsomstandigheden waren
    vaak zwaar, en kinderarbeid was gebruikelijk tot hervormingen aan het einde
    van de negentiende eeuw het dagelijks leven begonnen te verbeteren.</p>
